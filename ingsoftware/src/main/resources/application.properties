spring.application.name=proyecto
spring.config.import=optional:file:.env[.properties]

# Configuración de conexión a MySQL
# Cambien los parámetros del host, nombre y contraseña de la BD
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DB:casosdeuso}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: Recrea las tablas al iniciar y las borra al cerrar (ideal para pruebas)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cargar el archivo data.sql o import.sql después de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always